$kind: http-request
description: Applicant only, while status is applied.
url: "{{baseUrl}}/api/applications/{{application2Id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{candidate2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(true); });
    language: text/javascript
examples: ./.resources/Withdraw - 200 Success.resources/examples
order: 11000
