$kind: http-request
description: Application no longer exists.
url: "{{baseUrl}}/api/applications/{{application2Id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{candidate2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () { pm.response.to.have.status(404); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Withdraw - 404 Not Found.resources/examples
order: 12000
