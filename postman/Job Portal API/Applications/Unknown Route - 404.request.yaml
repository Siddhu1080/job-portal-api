$kind: http-request
description: |-
  Any unknown route returns a JSON 404.

  Access: public / no token.
url: "{{baseUrl}}/api/does-not-exist"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () { pm.response.to.have.status(404); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Unknown Route - 404.resources/examples
order: 13000
