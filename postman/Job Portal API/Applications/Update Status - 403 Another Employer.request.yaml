$kind: http-request
description: Only the owner of the job can change the status.
url: "{{baseUrl}}/api/applications/{{applicationId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "shortlisted"
    }
auth:
  type: bearer
  credentials:
    token: "{{employer2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403', function () { pm.response.to.have.status(403); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Update Status - 403 Another Employer.resources/examples
order: 4000
