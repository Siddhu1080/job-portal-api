$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{candidate2Token}}"
request:
  url: "{{baseUrl}}/api/applications/{{application2Id}}"
  method: DELETE
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Application withdrawn"
      }
order: 1000
