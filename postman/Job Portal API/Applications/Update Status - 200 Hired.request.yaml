$kind: http-request
description: shortlisted -> hired.
url: "{{baseUrl}}/api/applications/{{applicationId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "hired"
    }
auth:
  type: bearer
  credentials:
    token: "{{employerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(true); });
    language: text/javascript
examples: ./.resources/Update Status - 200 Hired.resources/examples
order: 7000
