$kind: http-request
description: Another employer cannot view statistics.
url: "{{baseUrl}}/api/jobs/{{jobId}}/stats"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{employer2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403', function () { pm.response.to.have.status(403); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Job Statistics - 403 Another Employer.resources/examples
order: 29000
