$kind: http-request
description: |-
  Public. page must be a positive integer.

  Access: public / no token.
url: "{{baseUrl}}/api/jobs?page=-1"
method: GET
queryParams:
  page: "-1"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400', function () { pm.response.to.have.status(400); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Get All Jobs - 400 Invalid Page.resources/examples
order: 10000
