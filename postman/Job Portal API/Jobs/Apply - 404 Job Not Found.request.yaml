$kind: http-request
description: Job does not exist.
url: "{{baseUrl}}/api/jobs/000000000000000000000000/apply"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "coverLetter": "I am excited to apply for this role and believe my skills are a strong fit."
    }
auth:
  type: bearer
  credentials:
    token: "{{candidateToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () { pm.response.to.have.status(404); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Apply - 404 Job Not Found.resources/examples
order: 20000
