$kind: http-request
description: Job owner only. Application counts per status (MongoDB $match + $group).
url: "{{baseUrl}}/api/jobs/{{jobId}}/stats"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{employerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(true); });
    language: text/javascript
examples: ./.resources/Job Statistics - 200 With Data.resources/examples
order: 28000
