$kind: http-request
description: Only the owner can close a job.
url: "{{baseUrl}}/api/jobs/{{closedJobId}}/close"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{employer2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403', function () { pm.response.to.have.status(403); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Close Job - 403 Another Employer.resources/examples
order: 22000
