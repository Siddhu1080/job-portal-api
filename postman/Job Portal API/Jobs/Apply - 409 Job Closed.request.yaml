$kind: http-request
description: Nobody can apply to a closed job.
url: "{{baseUrl}}/api/jobs/{{closedJobId}}/apply"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "coverLetter": "I am excited to apply for this role and believe my skills are a strong fit."
    }
auth:
  type: bearer
  credentials:
    token: "{{candidateToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 409', function () { pm.response.to.have.status(409); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Apply - 409 Job Closed.resources/examples
order: 24000
