$kind: http-request
description: |-
  Public. Query: search (title/company), location, type, skill, minSalary, sort (salary, -salary, createdAt, -createdAt, title, -title), page, limit, status (open|closed).

  Access: public / no token.
url: "{{baseUrl}}/api/jobs?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(true); });
    language: text/javascript
examples: ./.resources/Get All Jobs - 200 First Page.resources/examples
order: 7000
