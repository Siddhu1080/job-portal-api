$kind: http-request
description: Job owner only. Deletes the job and all its applications.
url: "{{baseUrl}}/api/jobs/{{deleteJobId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{employerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(true); });
    language: text/javascript
examples: ./.resources/Delete Job - 200 Success.resources/examples
order: 32000
