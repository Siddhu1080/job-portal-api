$kind: http-request
description: "Job owner only. Includes candidate name and email. Query: status (applied|shortlisted|rejected|hired)."
url: "{{baseUrl}}/api/jobs/{{jobId}}/applications"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{employerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(true); });
    language: text/javascript
examples: ./.resources/Get Job Applications - 200 Success.resources/examples
order: 25000
