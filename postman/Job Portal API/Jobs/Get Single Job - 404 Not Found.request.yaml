$kind: http-request
description: |-
  Public. Valid ID, no such job.

  Access: public / no token.
url: "{{baseUrl}}/api/jobs/000000000000000000000000"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () { pm.response.to.have.status(404); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(false); });
    language: text/javascript
examples: ./.resources/Get Single Job - 404 Not Found.resources/examples
order: 13000
