$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{employerToken}}"
request:
  url: "{{baseUrl}}/api/jobs/{{deleteJobId}}"
  method: DELETE
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Job and its applications deleted",
        "deletedApplications": 1
      }
order: 1000
