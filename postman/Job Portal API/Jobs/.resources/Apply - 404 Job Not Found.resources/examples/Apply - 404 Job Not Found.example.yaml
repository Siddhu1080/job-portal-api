$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{candidateToken}}"
request:
  url: "{{baseUrl}}/api/jobs/000000000000000000000000/apply"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "coverLetter": "I am excited to apply for this role and believe my skills are a strong fit."
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Job not found"
      }
order: 1000
