$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{employerToken}}"
request:
  url: "{{baseUrl}}/api/jobs/{{jobId}}/apply"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "coverLetter": "I am excited to apply for this role and believe my skills are a strong fit."
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Access denied: only candidate users can perform this action"
      }
order: 1000
