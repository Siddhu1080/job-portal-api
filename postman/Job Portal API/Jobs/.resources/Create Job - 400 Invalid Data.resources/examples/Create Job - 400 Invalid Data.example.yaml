$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{employerToken}}"
request:
  url: "{{baseUrl}}/api/jobs"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "title": "X",
        "description": "Y",
        "location": "Pune",
        "type": "weekend",
        "salary": -5,
        "skills": "node"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Type must be one of: full-time, part-time, internship, remote, Salary must be a positive number, Skills must be an array"
      }
order: 1000
