$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{candidate2Token}}"
request:
  url: "{{baseUrl}}/api/jobs/{{jobId}}/apply"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "coverLetter": "I am excited to apply for this role and believe my skills are a strong fit."
      }
