$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{candidateToken}}"
request:
  url: "{{baseUrl}}/api/jobs/{{closedJobId}}/apply"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "coverLetter": "I am excited to apply for this role and believe my skills are a strong fit."
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "This job is closed and no longer accepts applications"
      }
order: 1000
