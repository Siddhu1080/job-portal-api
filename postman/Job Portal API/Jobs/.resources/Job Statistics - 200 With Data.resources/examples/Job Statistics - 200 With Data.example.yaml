$kind: http-example
auth:
  type: bearer
  credentials:
    token: "{{employerToken}}"
request:
  url: "{{baseUrl}}/api/jobs/{{jobId}}/stats"
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "job": "6adc629cc3f8de3310fda065",
          "title": "Node.js Backend Developer",
          "jobStatus": "open",
          "total": 2,
          "byStatus": {
            "applied": 2,
            "shortlisted": 0,
            "rejected": 0,
            "hired": 0
          }
        }
      }
order: 1000
