$kind: http-request
description: |-
  Public. Returns one job.

  Access: public / no token.
url: "{{baseUrl}}/api/jobs/{{jobId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Success flag matches', function () { var j = pm.response.json(); pm.expect(j.success).to.eql(true); });
    language: text/javascript
examples: ./.resources/Get Single Job - 200 Success.resources/examples
order: 11000
