$kind: http-example
auth:
  type: noauth
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "candidate1@example.com",
        "password": "wrongpass"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Invalid email or password"
      }
order: 1000
