$kind: http-example
auth:
  type: noauth
request:
  url: "{{baseUrl}}/api/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "Bad User",
        "email": "not-an-email",
        "password": "123",
        "role": "employer"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "A valid email is required, Password must be at least 6 characters, Invalid value, Company name is required for employers"
      }
order: 1000
