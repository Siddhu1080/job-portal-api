$kind: http-example
auth:
  type: noauth
request:
  url: "{{baseUrl}}/api/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "Candidate One",
        "email": "candidate1@example.com",
        "password": "secret123",
        "role": "candidate"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Email is already registered"
      }
order: 1000
